name: CI

# "make clean && make && make run funciona en una maquina limpia" es un criterio
# de aceptacion del proyecto, asi que se verifica automaticamente.
#
# Se compila por los DOS caminos: CMake (build principal) y el Makefile de
# fallback. Si uno de los dos se rompe, el PR no se mergea.
#
# El job es Linux a proposito: es la rama del Makefile que NO se puede
# verificar a mano en la maquina de desarrollo (Windows), y ademas es la
# plataforma mas probable del profesor. El camino Windows se verifico a mano
# sobre MinGW-w64.

on:
  push:
    branches: [main]
  # SIN FILTRO DE RAMAS A PROPOSITO.
  #
  # La Fase 6 se entrega en una CADENA de pull requests y NINGUNO de ellos
  # apunta a `main`: cada porcion vive en su propia rama y el PR tracker es el
  # unico que conecta con `main` (ver issue #16, seccion 7.2). Con un filtro
  # `branches: [main]` el CI no se dispararia en ninguno de los PRs de la
  # cadena.
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Build y tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      # El dominio es PURO: no puede abrir archivos, ni imprimir, ni llamar a
      # comandos del sistema. Si una entidad necesita hacer E/S, es que la
      # responsabilidad esta mal puesta.
      # Las entidades si usan <ostream> (para el operator<<), y eso NO es
      # E/S: <ostream> no declara std::cout.
      - name: El dominio no toca I/O
        run: |
          if grep -rnE '\b(fstream|iostream|system[[:space:]]*\()' include/domain include/entities; then
            echo "::error::El dominio no puede incluir fstream, iostream ni system()."
            exit 1
          fi

      # La UI es la UNICA capa que puede depender de FTXUI: el motor de
      # terminal es un detalle de la presentacion y el dominio no tiene que
      # saber que existe. Se verifica con un grep, igual que la regla de
      # arriba.
      - name: "El dominio no depende de FTXUI"
        run: |
          if grep -rni 'ftxui' include/domain include/entities include/utils \
             include/repositories include/services include/persistence \
             include/structures include/exceptions; then
            echo "::error::La capa de dominio no puede depender de FTXUI."
            exit 1
          fi

      - name: Compilar con CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: El ejecutable arranca
        run: ./build/bin/sistema_turnos

      - name: Build con el Makefile de fallback
        run: |
          make clean
          make
          make test
          make run

      - name: Shellcheck (si hay scripts de shell)
        if: ${{ hashFiles('**/*.sh') != '' }}
        run: shellcheck $(find . -name '*.sh' -not -path './.git/*')
