name: CI

# "make clean && make && make run funciona en una maquina limpia" es un criterio
# de aceptacion del proyecto, asi que se verifica automaticamente.
#
# Se compila por los DOS caminos: CMake (build principal) y el Makefile de
# fallback. Si uno de los dos se rompe, el PR no se mergea.
#
# El job es Linux a proposito: es la rama del Makefile que NO se puede
# verificar a mano en la maquina de desarrollo (Windows), y ademas es la
# plataforma mas probable del profesor. El camino Windows se verifico a mano
# sobre MinGW-w64.

on:
  push:
    branches: [main]
  # SIN FILTRO DE RAMAS A PROPOSITO.
  #
  # La Fase 6 se entrega en una CADENA de pull requests y NINGUNO de ellos
  # apunta a `main`: cada porcion vive en su propia rama y el PR tracker es el
  # unico que conecta con `main` (ver issue #16, seccion 7.2). Con un filtro
  # `branches: [main]` el CI no se dispararia en ninguno de los PRs de la
  # cadena.
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Build y tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La imagen del runner YA trae cmake, ninja y g++: instalarlos con apt
      # es una red de seguridad, no un requisito.
      #
      # Por que no se instalan siempre: si el `apt-get update` falla (un
      # mirror que no responde, una lista de paquetes incompleta), el build
      # se cae por una causa que NO es del codigo. Ya paso: un run fallo con
      # "E: Unable to locate package cmake" mientras el run anterior, con
      # el mismo codigo, habia pasado. Un gate que depende de la red para
      # algo que ya esta instalado es un gate que falla solo.
      #
      # Asi que: se usa lo que hay, y el apt queda para el caso de que
      # falte algo de verdad.
      - name: Instalar toolchain
        run: |
          if ! command -v cmake >/dev/null 2>&1 || \
             ! command -v ninja >/dev/null 2>&1 || \
             ! command -v g++   >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build g++
          fi
          cmake --version
          ninja --version
          g++ --version

      # El dominio es PURO: no puede abrir archivos, ni imprimir, ni llamar a
      # comandos del sistema. Si una entidad necesita hacer E/S, es que la
      # responsabilidad esta mal puesta.
      # Las entidades si usan <ostream> (para el operator<<), y eso NO es
      # E/S: <ostream> no declara std::cout.
      - name: El dominio no toca I/O
        run: |
          if grep -rnE '\b(fstream|iostream|system[[:space:]]*\()' include/domain include/entities; then
            echo "::error::El dominio no puede incluir fstream, iostream ni system()."
            exit 1
          fi

      # La UI es la UNICA capa que puede depender de FTXUI: el motor de
      # terminal es un detalle de la presentacion y el dominio no tiene que
      # saber que existe. Se verifica con un grep, igual que la regla de
      # arriba.
      - name: "El dominio no depende de FTXUI"
        run: |
          if grep -rni 'ftxui' include/domain include/entities include/utils \
             include/repositories include/services include/persistence \
             include/structures include/exceptions; then
            echo "::error::La capa de dominio no puede depender de FTXUI."
            exit 1
          fi

      # `main.cpp` SOLO arma y despacha (requisito 9 de la consigna). Si
      # vuelve a DECIDIR algo, la logica de negocio se colo en el punto de
      # entrada. Se verifica con un grep, como las dos reglas de arriba.
      #
      #   - control de flujo: un `if` en `main.cpp` es una decision, y una
      #     decision en el punto de entrada es logica de negocio.
      #   - la capa de validacion: `main.cpp` no valida ni formatea. Eso es de
      #     `ui::Consola`, de `Fecha`/`Hora`, de `Utils` y de la persistencia.
      #
      # El registro de esta verificacion esta en `docs/decisiones.md`.
      - name: "main.cpp no tiene logica de negocio"
        run: |
          if grep -nE '\b(if|for|while|switch)\b' src/main.cpp; then
            echo "::error::main.cpp no puede decidir nada: el control de flujo es logica de negocio."
            exit 1
          fi
          if grep -nE '#include .*(Consola|Fecha|Utils|ArchivoTexto)\.h' src/main.cpp; then
            echo "::error::main.cpp no puede incluir la capa de validacion ni la de persistencia."
            exit 1
          fi

      - name: Compilar con CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: El ejecutable arranca
        run: ./build/bin/sistema_turnos

      - name: Build con el Makefile de fallback
        run: |
          make clean
          make
          make test
          make run

      - name: Shellcheck (si hay scripts de shell)
        if: ${{ hashFiles('**/*.sh') != '' }}
        run: shellcheck $(find . -name '*.sh' -not -path './.git/*')
